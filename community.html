<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>みんな — OpenGym Tokyo</title><meta name="theme-color" content="#000">
<style>
:root{--cy:#4FC3F7;--gr:#3DDC97;--pk:#FF4FA3;--ln:#222;--mu:#8a8a8a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
 line-height:1.5;padding-bottom:78px}
header{padding:16px 20px 11px;border-bottom:1px solid var(--ln)}
h1{font-size:19px;font-weight:800}h1 span{color:var(--cy)}
.sub{font-size:11px;color:var(--mu);margin-top:2px}
main{padding:17px 20px;max-width:780px;margin:0 auto}
h2{font-size:13px;color:var(--mu);font-weight:700;letter-spacing:.06em;margin:22px 0 11px}
h2:first-child{margin-top:0}
.lead{font-size:13px;color:var(--mu);margin:0 0 14px}
.card{background:#0c0c0c;border:1px solid var(--ln);border-radius:11px;padding:14px 16px;margin-bottom:11px}
.card .n{font-weight:800;font-size:15px}
select,input{width:100%;background:#0e0e0e;border:1px solid var(--ln);color:#fff;
 border-radius:9px;padding:11px 12px;margin-bottom:10px;font-family:inherit;font-size:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row3 select{margin-bottom:0}
button{background:var(--cy);color:#000;border:0;border-radius:9px;padding:11px 15px;
 font-weight:800;cursor:pointer;font-family:inherit;font-size:14px}
button.g{background:var(--gr)}button.sm{padding:8px 12px;font-size:12px}
button.o{background:transparent;color:var(--cy);border:1px solid #2a3a44}
label.cons{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:#9a9a9a;margin:12px 0}
label.cons input{width:auto;margin:2px 0 0}
.note{font-size:11px;color:#666;margin-top:10px;line-height:1.7}
.ok{color:var(--gr)}.warn{color:var(--pk)}
.big{font-size:46px;font-weight:800;line-height:1}
.big u{font-size:16px;color:var(--mu);text-decoration:none;margin-left:4px}
.scale{position:relative;height:52px;margin:16px 0 8px}
.axis{position:absolute;left:0;right:0;top:26px;height:6px;background:#181818;border-radius:3px}
.iqr{position:absolute;top:26px;height:6px;background:#1b3b4a;border-radius:3px}
.med{position:absolute;top:19px;width:2px;height:20px;background:var(--cy)}
.me{position:absolute;top:12px;width:3px;height:34px;background:var(--gr);border-radius:2px}
.tick{position:absolute;top:40px;font-size:10px;color:#666;transform:translateX(-50%)}
.melab{position:absolute;top:-4px;font-size:11px;color:var(--gr);font-weight:800;transform:translateX(-50%);white-space:nowrap}
.bar{height:8px;background:#181818;border-radius:4px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--gr);border-radius:4px}
.cheer{font-size:12.5px;color:#cfe;background:#0a1a20;border:1px solid #17323d;
 border-radius:9px;padding:9px 11px;margin-top:8px;line-height:1.7}
nav{position:fixed;bottom:0;left:0;right:0;background:#080808;border-top:1px solid var(--ln);
 display:flex;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
nav a{flex:1;text-align:center;color:#666;text-decoration:none;font-size:10px;padding:5px 0;font-weight:700}
nav a.on{color:var(--cy)}nav a i{display:block;font-size:16px;font-style:normal;margin-bottom:1px}
</style></head><body>
<header><h1>みんな<span> — OpenGym Tokyo</span></h1>
<div class="sub">匿名クラスタ／AIが企画するバーチャルイベント</div></header>
<main>

<h2>匿名で参加する</h2>
<div class="card">
  <div class="lead" style="margin-bottom:12px">
    近い属性の人の中で、いま自分がどのあたりかを知るために、記録を匿名で共有します。</div>
  <div class="row3">
    <select id="age"><option value="">年代</option></select>
    <select id="sex"><option value="">性別</option><option>男性</option><option>女性</option><option>回答しない</option></select>
    <select id="goal"><option value="">目的</option><option>筋力アップ</option><option>減量</option><option>健康維持</option><option>リハビリ</option></select>
  </div>
  <label class="cons"><input type="checkbox" id="cons">
    <span>種目ごとのベスト重量を<b style="color:#fff">匿名で提供する</b>ことに同意する<br>
    <span style="color:#666">送るのは 匿名ID・年代・性別・目的・種目別ベスト重量 のみ。<br>
    氏名、日付、利用施設、体組成は送りません。いつでも参加をやめられます。</span></span></label>
  <button onclick="join()">この内容で参加する</button>
  <button class="sm o" style="margin-left:8px" onclick="leave()">やめる</button>
  <div class="note" id="join-st"></div>
</div>

<h2>クラスタ内での位置</h2>
<div class="card">
  <select id="mach"><option value="">種目を選ぶ</option></select>
  <div id="pos"></div>
</div>

<h2>今週のバーチャルイベント<span style="color:#555">（AIが企画・進行）</span></h2>
<div class="card" id="ev"><div class="note">読み込み中…</div></div>

<div class="note">
  ※ 匿名IDはこの端末で生成した乱数で、個人と結びつきません。<br>
  ※ 現在の分布にはデモ用の匿名サンプルを含みます。
</div>
</main>
<nav>
  <a href="index.html"><i>◱</i>データ</a>
  <a href="index.html#find"><i>◎</i>さがす</a>
  <a href="index.html#log"><i>▲</i>きろく</a>
  <a href="index.html#body"><i>◇</i>からだ</a>
  <a href="community.html" class="on"><i>❋</i>みんな</a>
</nav>
<script>
const $=s=>document.querySelector(s);
const LS={g:(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d)),s:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
for(let a=10;a<=70;a+=10)$('#age').insertAdjacentHTML('beforeend',`<option value="${a}">${a}代</option>`);

function anonId(){let v=localStorage.getItem('ogt_anon');
 if(!v){v=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());
 localStorage.setItem('ogt_anon',v);}return v;}

/* 端末内の記録から種目別ベストを取り出す（読み取りのみ・本体には触れない） */
function bests(){const log=LS.g('ogt_log',[]),m={};
 for(const l of log){if(!l.m||!(l.w>0))continue;
  if(!m[l.m]||l.w>m[l.m].weight)m[l.m]={machine:l.m,weight:l.w,reps:l.r||0};}
 return Object.values(m);}

/* ?demo=1 : 端末に記録が無い環境でも動きを確認できるようにする */
if(new URLSearchParams(location.search).get('demo')){
  if(!LS.g('ogt_log',[]).length){const d=864e5,f='旭町南地区区民館';
    LS.s('ogt_log',[{f,m:'チェストプレス',w:31,r:10,t:Date.now()-3*d},
      {f,m:'ラットプルダウン',w:32,r:10,t:Date.now()-6*d},
      {f,m:'レッグプレス',w:68,r:12,t:Date.now()-3*d}]);}
  LS.s('ogt_prof',{age:'40',sex:'男性',goal:'筋力アップ'});
}
const P=LS.g('ogt_prof',null);
if(P){$('#age').value=P.age||'';$('#sex').value=P.sex||'';$('#goal').value=P.goal||'';$('#cons').checked=true;
 $('#join-st').innerHTML='<span class="ok">参加中です。</span>';}

async function join(){
 if(!$('#cons').checked){$('#join-st').innerHTML='<span class="warn">同意にチェックが必要です</span>';return;}
 const rec=bests();
 if(!rec.length){$('#join-st').innerHTML='<span class="warn">まず「きろく」で1件でも記録してください</span>';return;}
 const prof={age:$('#age').value,sex:$('#sex').value,goal:$('#goal').value};
 LS.s('ogt_prof',prof);
 try{const r=await fetch('/api/cluster',{method:'POST',headers:{'content-type':'application/json'},
   body:JSON.stringify({consent:true,anonId:anonId(),...prof,records:rec})});
  const j=await r.json();
  $('#join-st').innerHTML=j.ok?`<span class="ok">${j.machines.length}種目を匿名で共有しました。</span>`:'<span class="warn">'+j.error+'</span>';
  fillMach();}catch(e){$('#join-st').innerHTML='<span class="warn">通信に失敗しました</span>';}}

function leave(){localStorage.removeItem('ogt_prof');$('#cons').checked=false;
 $('#join-st').innerHTML='<span class="ok">参加をやめました。以後は共有されません。</span>';}

function fillMach(){const b=bests();
 $('#mach').innerHTML='<option value="">種目を選ぶ</option>'+
  b.map(x=>`<option value="${x.machine}" data-w="${x.weight}">${x.machine}（自己ベスト ${x.weight}kg）</option>`).join('');}
fillMach();
if(new URLSearchParams(location.search).get('demo')){
  setTimeout(()=>{const o=$('#mach').querySelector('option[value="チェストプレス"]');
    if(o){$('#mach').value='チェストプレス';$('#mach').onchange();}},250);}

$('#mach').onchange=async()=>{
 const el=$('#mach'),m=el.value;if(!m){$('#pos').innerHTML='';return;}
 const my=+el.selectedOptions[0].dataset.w, p=LS.g('ogt_prof',{});
 $('#pos').innerHTML='<div class="note">集計中…</div>';
 try{const q=new URLSearchParams({machine:m,weight:my,age:p.age||'',sex:p.sex||'',goal:p.goal||''});
  const j=await (await fetch('/api/cluster?'+q)).json();
  if(!j.ok||!j.stats){$('#pos').innerHTML='<div class="note">まだ比較できるデータがありません。</div>';return;}
  const s=j.stats,lo=s.min,hi=s.max,rng=(hi-lo)||1,pos=x=>((x-lo)/rng*100).toFixed(1);
  $('#pos').innerHTML=`
   <div class="big">${j.percentile==null?'—':'上位 '+(100-j.percentile)+'%'}<u>${j.scope}・${s.n}人中</u></div>
   <div class="scale">
     <div class="axis"></div>
     <div class="iqr" style="left:${pos(s.q1)}%;width:${(pos(s.q3)-pos(s.q1)).toFixed(1)}%"></div>
     <div class="med" style="left:${pos(s.med)}%"></div>
     <div class="me" style="left:${pos(my)}%"></div>
     <div class="melab" style="left:${pos(my)}%">あなた ${my}kg</div>
     <div class="tick" style="left:0%">${s.min}</div>
     <div class="tick" style="left:${pos(s.med)}%">中央値 ${s.med}</div>
     <div class="tick" style="left:100%">${s.max}</div>
   </div>
   <div class="note">青帯は中央50%（${s.q1}〜${s.q3}kg）。全体では ${j.total} 人が同じ種目を共有しています。</div>`;
 }catch(e){$('#pos').innerHTML='<div class="note warn">集計に失敗しました</div>';}};

/* 今週のイベント */
async function loadEv(){
 try{const j=await (await fetch('/api/event')).json();if(!j.ok)throw 0;
  const pct=Math.min(100,Math.round(j.total/(j.goal||1)*100));
  $('#ev').innerHTML=`
   <div class="n">${j.title}</div>
   <div class="lead" style="margin:6px 0 0">${j.body}</div>
   <div class="bar"><i style="width:${pct}%"></i></div>
   <div class="note" style="margin-top:0">全体 <b style="color:#fff">${j.total}</b> / ${j.goal}${j.unit}　参加 ${j.people} 人　${j.week}</div>
   <div style="display:flex;gap:8px;align-items:center;margin-top:12px">
     <input id="amt" type="number" value="10" min="1" max="500" style="width:90px;margin:0">
     <span style="font-size:13px;color:#9a9a9a">${j.unit} 積む</span>
     <button class="sm g" onclick="push()">参加する</button>
   </div>
   <div id="cheer"></div>
   <div class="note">企画：${j.by&&j.by.startsWith('@cf')?'Workers AI が自動生成':'既定'}</div>`;
 }catch(e){$('#ev').innerHTML='<div class="note warn">イベントを取得できませんでした</div>';}}
loadEv();

async function push(){const a=+($('#amt').value||0);
 $('#cheer').innerHTML='<div class="note">送信中…</div>';
 try{const j=await (await fetch('/api/event',{method:'POST',headers:{'content-type':'application/json'},
   body:JSON.stringify({anonId:anonId(),amount:a})})).json();
  if(!j.ok)throw new Error(j.error);
  $('#cheer').innerHTML=`<div class="cheer">${j.cheer}</div>`;
  loadEv();}catch(e){$('#cheer').innerHTML='<div class="note warn">'+e.message+'</div>';}}
</script></body></html>
