<h2>おなじくらいの人が、<br><span class="em">どれくらいか</span>わかります。</h2>
<p class="lead">名前は出ません。年代と性別と目的だけで、ゆるくくらべます。</p>

<h3>さんかする</h3>
<div class="card cream">
  <label class="f" for="age">年代</label>
  <select id="age"><option value="">えらんでください</option></select>
  <label class="f" for="sex">性別</label>
  <select id="sex"><option value="">えらんでください</option><option>男性</option><option>女性</option><option>答えない</option></select>
  <label class="f" for="goal">なんのために</label>
  <select id="goal"><option value="">えらんでください</option><option>筋力アップ</option><option>減量</option><option>健康維持</option><option>リハビリ</option></select>

  <label class="cons"><input type="checkbox" id="cons">
    <span><b>じぶんの記録を、名前をふせて出す</b><br>
    <span class="small">おくるのは　年代・性別・目的・種目ごとの一番重かった重さ　だけです。<br>
    お名前、いつ行ったか、どのジムかは、おくりません。いつでもやめられます。</span></span></label>
  <div class="btnrow">
    <button onclick="join()">これでさんかする</button>
    <button class="ghost sm" onclick="leave()">やめる</button>
  </div>
  <div class="msg" id="join-st"></div>
</div>

<h3>いま、どのあたり？</h3>
<div class="card">
  <label class="f" for="mach">種目をえらぶ</label>
  <select id="mach"><option value="">えらんでください</option></select>
  <div id="pos"></div>
</div>

<h3>こんしゅうの みんなの企画</h3>
<div class="card or" id="ev"><div class="sub">よみこみ中…</div></div>

<div class="small" style="margin-top:20px">

</div>
